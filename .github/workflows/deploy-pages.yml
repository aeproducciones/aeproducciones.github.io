name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable public site
        uses: actions/checkout@v4
        with:
          ref: 447595af60646f757f524a76bdffa1398b9c6cd9

      - name: Add official presentation PDF
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/aeproducciones/aeproducciones.github.io/main/public/media/AE-Producciones-Presentacion.pdf" \
            --output public/media/AE-Producciones-Presentacion.pdf
          echo "c54157efe4c4be186b0834693d67c9b5b83c3c2b8f456873f9b69724f51006de  public/media/AE-Producciones-Presentacion.pdf" | sha256sum --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
